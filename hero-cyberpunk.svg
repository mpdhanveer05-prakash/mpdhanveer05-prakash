<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="M.P. Dhanveer Prakash — cyberpunk hero">
  <defs>
    <!-- ════════════════  GRADIENTS  ════════════════ -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#05010F"/>
      <stop offset="45%" stop-color="#0B0220"/>
      <stop offset="100%" stop-color="#1A0533"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F5FF"/>
      <stop offset="50%"  stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>

    <linearGradient id="scanLineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hLineGradPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF2A6D" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF2A6D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FF2A6D" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#B026FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- ════════════════  PATTERNS  ════════════════ -->
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F5FF" stroke-width="0.4" stroke-opacity="0.25"/>
    </pattern>

    <!-- Perspective grid for the floor -->
    <pattern id="floorGrid" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 80 0 M 0 40 L 80 40" fill="none" stroke="#FF2A6D" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <!-- ════════════════  FILTERS  ════════════════ -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Clip the perspective floor -->
    <clipPath id="floorClip">
      <polygon points="0,360 1280,360 1280,265 0,265"/>
    </clipPath>
  </defs>

  <!-- ════════════════  BASE LAYER  ════════════════ -->
  <rect width="1280" height="360" fill="url(#bgGrad)"/>

  <!-- Top half subtle grid -->
  <rect width="1280" height="265" fill="url(#gridPattern)" opacity="0.55"/>

  <!-- ════════════════  SYNTHWAVE SUN  ════════════════ -->
  <g transform="translate(640, 200)">
    <!-- glow halo -->
    <circle cx="0" cy="0" r="260" fill="url(#sunGrad)" opacity="0.5"/>
    <!-- sun disc -->
    <circle cx="0" cy="0" r="115" fill="#0B0220" stroke="#FF2A6D" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- sun horizontal slats -->
    <g stroke="#0B0220" stroke-width="3" fill="none">
      <line x1="-115" y1="55"  x2="115" y2="55"/>
      <line x1="-115" y1="68"  x2="115" y2="68"/>
      <line x1="-115" y1="82"  x2="115" y2="82"/>
      <line x1="-115" y1="98"  x2="115" y2="98"/>
    </g>
    <!-- inner gradient ring for color -->
    <circle cx="0" cy="0" r="113" fill="none" stroke="#B026FF" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ════════════════  PERSPECTIVE FLOOR GRID  ════════════════ -->
  <g clip-path="url(#floorClip)" opacity="0.85">
    <!-- horizon glow line -->
    <line x1="0" y1="265" x2="1280" y2="265" stroke="#FF2A6D" stroke-width="2" filter="url(#softGlow)"/>
    <line x1="0" y1="265" x2="1280" y2="265" stroke="#00F5FF" stroke-width="0.6"/>

    <!-- horizontal receding lines -->
    <g stroke="#FF2A6D" fill="none" stroke-opacity="0.7">
      <line x1="0" y1="280"  x2="1280" y2="280"  stroke-width="0.6"/>
      <line x1="0" y1="298"  x2="1280" y2="298"  stroke-width="0.7"/>
      <line x1="0" y1="318"  x2="1280" y2="318"  stroke-width="0.8"/>
      <line x1="0" y1="340"  x2="1280" y2="340"  stroke-width="1"/>
    </g>

    <!-- radial converging lines to vanishing point at (640, 265) -->
    <g stroke="#FF2A6D" stroke-width="0.8" stroke-opacity="0.55">
      <line x1="640" y1="265" x2="-200"  y2="360"/>
      <line x1="640" y1="265" x2="-40"   y2="360"/>
      <line x1="640" y1="265" x2="120"   y2="360"/>
      <line x1="640" y1="265" x2="260"   y2="360"/>
      <line x1="640" y1="265" x2="390"   y2="360"/>
      <line x1="640" y1="265" x2="500"   y2="360"/>
      <line x1="640" y1="265" x2="590"   y2="360"/>
      <line x1="640" y1="265" x2="690"   y2="360"/>
      <line x1="640" y1="265" x2="780"   y2="360"/>
      <line x1="640" y1="265" x2="890"   y2="360"/>
      <line x1="640" y1="265" x2="1020"  y2="360"/>
      <line x1="640" y1="265" x2="1160"  y2="360"/>
      <line x1="640" y1="265" x2="1320"  y2="360"/>
      <line x1="640" y1="265" x2="1480"  y2="360"/>
    </g>
  </g>

  <!-- ════════════════  HUD CORNER BRACKETS  ════════════════ -->
  <g stroke="#00F5FF" stroke-width="2" fill="none" filter="url(#softGlow)">
    <!-- TL -->
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <!-- TR -->
    <path d="M 1256 24 L 1256 60 M 1256 24 L 1220 24"/>
    <!-- BL -->
    <path d="M 24 336 L 24 300 M 24 336 L 60 336"/>
    <!-- BR -->
    <path d="M 1256 336 L 1256 300 M 1256 336 L 1220 336"/>
  </g>

  <!-- Inner pink corner ticks -->
  <g stroke="#FF2A6D" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M 40 40 L 40 52 M 40 40 L 52 40"/>
    <path d="M 1240 40 L 1240 52 M 1240 40 L 1228 40"/>
    <path d="M 40 320 L 40 308 M 40 320 L 52 320"/>
    <path d="M 1240 320 L 1240 308 M 1240 320 L 1228 320"/>
  </g>

  <!-- ════════════════  TOP HUD STRIP  ════════════════ -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#00F5FF" opacity="0.85">
    <text x="80" y="50">SYS://mainframe_dhanveer.exe</text>
    <text x="80" y="65" fill="#FF2A6D">● UPLINK ESTABLISHED</text>
    <text x="1200" y="50" text-anchor="end">v4.0.1</text>
    <text x="1200" y="65" text-anchor="end" fill="#B026FF">[ NEURAL_LINK: ACTIVE ]</text>
  </g>

  <!-- Horizontal accent lines flanking the name -->
  <line x1="80"   y1="180" x2="320"  y2="180" stroke="url(#hLineGrad)"      stroke-width="1.2"/>
  <line x1="960"  y1="180" x2="1200" y2="180" stroke="url(#hLineGrad)"      stroke-width="1.2"/>
  <line x1="160"  y1="195" x2="320"  y2="195" stroke="url(#hLineGradPink)"  stroke-width="0.8"/>
  <line x1="960"  y1="195" x2="1120" y2="195" stroke="url(#hLineGradPink)"  stroke-width="0.8"/>

  <!-- ════════════════  MAIN NAME (with glitch offsets)  ════════════════ -->
  <!-- pink ghost layer -->
  <text x="640" y="160" text-anchor="middle"
        font-family="'Orbitron', 'Audiowide', 'Arial Black', sans-serif"
        font-size="62" font-weight="900" fill="#FF2A6D" opacity="0.55"
        letter-spacing="4" transform="translate(-3,0)">M.P. DHANVEER PRAKASH</text>
  <!-- cyan ghost layer -->
  <text x="640" y="160" text-anchor="middle"
        font-family="'Orbitron', 'Audiowide', 'Arial Black', sans-serif"
        font-size="62" font-weight="900" fill="#00F5FF" opacity="0.55"
        letter-spacing="4" transform="translate(3,0)">M.P. DHANVEER PRAKASH</text>
  <!-- main gradient layer -->
  <text x="640" y="160" text-anchor="middle"
        font-family="'Orbitron', 'Audiowide', 'Arial Black', sans-serif"
        font-size="62" font-weight="900" fill="url(#nameGrad)"
        letter-spacing="4" filter="url(#neonGlow)">M.P. DHANVEER PRAKASH</text>

  <!-- ════════════════  SUBTITLE (ROLE)  ════════════════ -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace"
     font-size="16" font-weight="700" letter-spacing="6" text-anchor="middle">
    <text x="640" y="210" fill="#00F5FF" filter="url(#softGlow)">
      &gt; FULL_STACK  //  AI_AUTOMATION  //  CLOUD_ARCHITECT &lt;
    </text>
  </g>

  <!-- ════════════════  BOTTOM TAGLINE  ════════════════ -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <text x="640" y="245" text-anchor="middle" fill="#B026FF" letter-spacing="3">
      [ shipping intelligent systems @ the edge of AI ]
    </text>
  </g>

  <!-- ════════════════  BOTTOM HUD STRIP  ════════════════ -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#00F5FF" opacity="0.9">
    <text x="80" y="320">&gt;_ status: ONLINE</text>
    <text x="80" y="335" fill="#FF2A6D">&gt;_ mode:   BUILDING</text>
    <text x="640" y="320" text-anchor="middle" fill="#B026FF">::: GITHUB.COM/MPDHANVEER05-PRAKASH :::</text>
    <text x="1200" y="320" text-anchor="end">loc: IN [+5:30]</text>
    <text x="1200" y="335" text-anchor="end" fill="#FF2A6D">uptime: 99.9%</text>
  </g>

  <!-- Scan line overlay -->
  <rect x="0" y="0" width="1280" height="360" fill="url(#scanLineGrad)" opacity="0.6"/>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="360" fill="url(#vignette)"/>

  <!-- Subtle noise dots for texture -->
  <g fill="#00F5FF" opacity="0.4">
    <circle cx="120"  cy="80"  r="0.8"/>
    <circle cx="280"  cy="120" r="0.6"/>
    <circle cx="1100" cy="90"  r="0.7"/>
    <circle cx="950"  cy="140" r="0.5"/>
    <circle cx="200"  cy="220" r="0.6"/>
    <circle cx="1050" cy="240" r="0.8"/>
    <circle cx="180"  cy="290" r="0.5"/>
    <circle cx="1100" cy="280" r="0.6"/>
  </g>
</svg>
